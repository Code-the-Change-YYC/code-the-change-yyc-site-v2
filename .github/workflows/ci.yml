name: CI

# The old repo ran ESLint on push only and never ran `next build`, so broken
# builds reached main. This runs the full gate on PRs too.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the `packageManager` field in package.json for the version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Pages prerender Contentful content at build time. Only the read-only
      # Delivery API values are exposed here; preview/webhook secrets stay out
      # of CI. Sections must still render an empty state when these are
      # missing (e.g. PRs from forks, which don't receive secrets).
      - name: Build
        run: pnpm build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
